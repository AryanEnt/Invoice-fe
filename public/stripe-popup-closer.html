<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finishing Stripe connection…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: #f7f8fa;
        color: #1a1a1a;
      }
      p {
        font-size: 14px;
        color: #5c6670;
      }
    </style>
  </head>
  <body>
    <p id="status">Finishing up… You can close this tab.</p>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var status = params.get("status") || "error";
        var message =
          params.get("message") || "Unable to connect Stripe. Please try again.";

        var payload =
          status === "success"
            ? { type: "stripe-connected" }
            : { type: "stripe-error", message: message };

        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage(payload, window.location.origin);
          }
        } catch (e) {}

        window.setTimeout(function () {
          window.close();
          document.getElementById("status").textContent =
            "You can close this tab and return to InvoiceHub.";
        }, 50);
      })();
    </script>
  </body>
</html>
