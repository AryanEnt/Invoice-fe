name: Deploy frontend

on:
  push:
    branches:
      - release/frontend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://invoice-backend-production-5085.up.railway.app' }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Turnstile configuration
        run: |
          if [ -z "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" ]; then
            echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY is not configured in the production environment."
            exit 1
          fi

      - name: Verify API configuration
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "NEXT_PUBLIC_API_URL is not configured in the production environment."
            exit 1
          fi
          echo "Using API origin: ${NEXT_PUBLIC_API_URL%/}"

      - name: Build and deploy
        run: npm run deploy
